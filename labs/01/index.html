<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aula de HTML e CSS">
    <title>Laboratorio de Aula HTML</title>
</head>
<body>
    <header id="cabecalho">
        <p><a href="index.html">&larr;; Voltar para a Página Principal (Início)</a></p>
        <h1 class="titulo">Área de Contato do Cliente</h1>
        <nav class="menu">
            <a href="#">Ajuda</a> | <a href="#">Sair</a>
        </nav>
    </header>
    <main>
        <article>
            <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
            <form action="/enviar" method="POST">
                <label for="idNome">Nome:</label>
                <input type="text" name="nome" id="idNome" required minlength="3"><br><br>
                <label for="idEmail">Email:</label>
                <input type="email" name="email" id="idEmail" required minlength="5"><br><br>
                <label for="idcel">Telefone Celular:</label>
                <input type="tel" name="celular" id="idcel" required pattern="[0-9]{11}" title="telefone deve ter no minimo 11 caracteres truncados" maxlength="11"
><br><br>
                <label for="idMsgArea">Mensagem:</label>
                <textarea name="msg" id="idMsgArea"></textarea><br><br>
                
                <input type="button" value="Disparar Dados">
            </form>
        </article>
    </main>

    <footer id="rodape">
        Suporte Tech 2026
    </footer>
</body>
</html>
